{% set name = "trame" %}
{% set version = "3.13.2" %}


package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9868d1c2bce981ae2c66eb6a16d39e2a14f042eedb1047666266c753ecaf3f64

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - trame-server >=3.12.2,<4
    - trame-client >=3.12.2,<4
    - trame-common >=1.2.3,<2
    - wslink >=2.5.6
    - pyyaml

# no tests provideed by PyPi package, use `pip check` only
test:
  imports:
    - trame
    - trame.app
    - trame.assets
    - trame.env
    - trame.modules
    - trame.tools
    - trame.ui
    - trame.utils
    - trame.widgets
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/trame
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Trame, a framework to build applications in plain Python
  description: |
    Trame is an easy-to-use, Python-based framework that let you create desktop like application which shows up in your web browser.
    You can create buttons, dialogs, 3D scenes with VTK/ParaView, charts, maps and much more.
  doc_url: https://github.com/Kitware/trame/blob/master/README.md
  dev_url: https://github.com/Kitware/trame

extra:
  recipe-maintainers:
    - larsoner
    - jourdain
    - psavery
    - kwrobot
